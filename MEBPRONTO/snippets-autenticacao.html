<!-- ========================================
  SNIPPET 1: PROTEGER PÁGINA (OBRIGATÓRIO)
  Use em TODAS as páginas
======================================== -->

<script src="meb-auth-sistema.js"></script>
<script src="meb-client-corrigido.js"></script>

<script>
  // ⚙️ CONFIGURAÇÃO
  const SUPABASE_URL = 'YOUR_SUPABASE_URL';
  const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';

  // 🔐 AUTENTICAÇÃO
  const auth = new MEBAuth(SUPABASE_URL, SUPABASE_ANON_KEY);
  const meb = new MEBClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  meb.initializeAuth(auth);

  // 🛡️ PROTEGER: Redirecionar não-autenticados
  if (!auth.isAuthenticated()) {
    window.location.href = '/🔐_LOGIN.html';
  }
</script>

<!-- ========================================
  SNIPPET 6: ESCUTAR MUDANÇAS DE AUTENTICAÇÃO
  Use em páginas que precisam atualizar em tempo real
======================================== -->

<script>
  // [SNIPPET 1: PROTEGER PÁGINA]

  // Escutar login/logout de outras abas
  const unsubscribe = auth.onAuthStateChange((eventType, data) => {
    if (eventType === 'login') {
      console.log('Usuário fez login:', data);
      // Atualizar UI se necessário
      location.reload();
    } else if (eventType === 'logout') {
      console.log('Usuário fez logout');
      // Redirecionar para login
      window.location.href = '/🔐_LOGIN.html';
    }
  });

  // Cleanup quando sair da página
  window.addEventListener('beforeunload', unsubscribe);
</script>


<!-- ========================================
  SNIPPET 7: ATUALIZAR PERFIL DO USUÁRIO
  Use em páginas de configuração/perfil
======================================== -->

<form id="form-perfil" style="max-width: 400px; margin: 20px;">
  <h2>Meu Perfil</h2>

  <div style="margin: 15px 0;">
    <label>Nome Completo:</label>
    <input type="text" id="input-nome" placeholder="Seu nome" style="width: 100%; padding: 10px;">
  </div>

  <div style="margin: 15px 0;">
    <label>Email:</label>
    <input type="email" id="input-email" placeholder="seu@email.com" disabled style="width: 100%; padding: 10px; background: #f0f0f0;">
  </div>

  <button type="submit" style="
    background: #5C6B3A;
    color: white;
    padding: 10px 20px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    font-weight: bold;
    width: 100%;
  ">
    Salvar Alterações
  </button>
</form>

<script>
  // [SNIPPET 1: PROTEGER PÁGINA]

  // Preencher campos
  document.getElementById('input-nome').value = auth.user.nome;
  document.getElementById('input-email').value = auth.user.email;

  // Salvar alterações
  document.getElementById('form-perfil').addEventListener('submit', async (e) => {
    e.preventDefault();

    const novoNome = document.getElementById('input-nome').value.trim();

    if (!novoNome) {
      alert('Nome não pode estar vazio');
      return;
    }

    const result = await auth.updateProfile({ nome: novoNome });

    if (result.success) {
      alert('Perfil atualizado com sucesso!');
    } else {
      alert('Erro: ' + result.error);
    }
  });
</script>

<!-- ========================================
  SNIPPET 9: RECUPERAÇÃO DE SENHA
  Use em página separada ou modal
======================================== -->

<div style="max-width: 400px; margin: 30px auto; padding: 20px; border: 1px solid #E5D9C9; border-radius: 10px;">
  <h2 style="color: #5C6B3A;">Redefinir Senha</h2>

  <div id="reset-message" style="
    padding: 10px;
    border-radius: 5px;
    margin-bottom: 15px;
    display: none;
  "></div>

  <form id="form-recuperacao">
    <div style="margin: 15px 0;">
      <label>Email:</label>
      <input type="email" id="reset-email" placeholder="seu@email.com" required style="width: 100%; padding: 10px;">
    </div>

    <button type="submit" style="
      width: 100%;
      padding: 10px;
      background: #5C6B3A;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
    ">
      Enviar Link de Recuperação
    </button>
  </form>
</div>

<script>
  // NOTA: Não precisa de auth.isAuthenticated() aqui
  const auth2 = new MEBAuth('YOUR_SUPABASE_URL', 'YOUR_SUPABASE_ANON_KEY');

  document.getElementById('form-recuperacao').addEventListener('submit', async (e) => {
    e.preventDefault();

    const email = document.getElementById('reset-email').value.trim();
    const message = document.getElementById('reset-message');

    const result = await auth2.requestPasswordReset(email);

    if (result.success) {
      message.textContent = '✅ ' + result.message;
      message.style.background = '#E5F5E5';
      message.style.color = '#4C8C4C';
      message.style.display = 'block';
    } else {
      message.textContent = '❌ ' + result.error;
      message.style.background = '#FFE5E5';
      message.style.color = '#C84C4C';
      message.style.display = 'block';
    }
  });
</script>
